<style>
  html, body { margin: 0; height: 100%; }

  .vert { fill: var(--vert); }
  .ink { fill: var(--text); }
  .blk { rx: var(--radius-md); }
  .plus { stroke: var(--hydro); stroke-width: 1; opacity: 0.45; }
  .seg { fill: var(--strip); }
  .rule { fill: var(--strip); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 64px; line-height: 0.95; font-weight: 800; font-stretch: var(--stretch-semiwide); letter-spacing: -0.01em; color: var(--text); }

</style>
