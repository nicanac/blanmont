<!-- @dsCard group="Forms" height=200 subtitle="Default and recessed filter field" -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Input</title>
<style>
  body { margin: 0; padding: 20px; background: var(--surface); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 640px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="bl-field">
      <label class="bl-label" for="nom">Nom du parcours</label>
      <input class="bl-input" id="nom" type="text" value="Boucle de la Dyle">
      <span class="bl-help">Affiché sur la fiche et dans le calendrier.</span>
    </div>
    <div class="bl-field">
      <label class="bl-label" for="dist">Distance (km)</label>
      <input class="bl-input bl-tabular" id="dist" type="text" inputmode="decimal" placeholder="85">
    </div>
    <div class="bl-field">
      <label class="bl-label" for="filtre">Filtrer les membres</label>
      <input class="bl-input bl-input--recessed" id="filtre" type="search" placeholder="Nom, groupe, licence…">
    </div>
  </div>
</body>
</html>
